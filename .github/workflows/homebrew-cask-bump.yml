name: Homebrew Cask Bump

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.13.3). Leave blank to auto-detect."
        required: false
        type: string
      dry_run:
        description: "Run without commit/push to tap repo"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  bump-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout informity-ai
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=""

          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          fi

          if [[ -z "$version" ]]; then
            version="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
            )"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Compute artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          dmg_url="https://www.informity.ai/download/Informity_AI_${version}_aarch64.dmg"

          echo "Checking DMG URL: $dmg_url"
          curl -fsSL "$dmg_url" -o informity.dmg
          sha256="$(shasum -a 256 informity.dmg | awk '{print $1}')"

          echo "dmg_url=$dmg_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $sha256"

      - name: Configure SSH (github.com-inf)
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        shell: bash
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_SSH_KEY:-}" ]]; then
            echo "Missing required secret: HOMEBREW_TAP_SSH_KEY" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > ~/.ssh/id_ed25519_informity
          chmod 600 ~/.ssh/id_ed25519_informity
          cat >> ~/.ssh/config <<'CFG'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_informity
            IdentitiesOnly yes

          Host github.com-inf
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_informity
            IdentitiesOnly yes
          CFG
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: informity/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          persist-credentials: false

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap config user.name "informity-bot"
          git -C homebrew-tap config user.email "bot@informity.ai"

      - name: Bump cask in tap repo
        shell: bash
        run: |
          set -euo pipefail
          DRY_RUN_FLAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          bash scripts/release/release_update_homebrew_cask.sh \
            --version "${{ steps.version.outputs.version }}" \
            --sha256 "${{ steps.artifact.outputs.sha256 }}" \
            --tap-dir "homebrew-tap" \
            $DRY_RUN_FLAG

      - name: Audit cask
        shell: bash
        run: |
          set -euo pipefail
          brew untap informity/tap 2>/dev/null || true
          brew tap informity/tap "$PWD/homebrew-tap" --custom-remote
          brew audit --cask informity-ai
